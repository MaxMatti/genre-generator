    function capitalization(word, suffix) {
        if (word == "" || word.endsWith(" ") || word.endsWith("-")) {
          return suffix[0].toUpperCase() + suffix.substring(1);
        } else {
          return suffix[0].toLowerCase() + suffix.substring(1);
        }
    }
